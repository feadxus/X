name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 2️⃣. 📥 安装 Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # 3️⃣. ⏬ 下载模型(使用 pull 避免交互式卡住,并检测服务是否就绪)
      - name: Pull Ollama Model
        run: |
          echo "⏳ 等待 Ollama 后台服务就绪..."
          # 循环检测本地 11434 端口，最多等待 30 秒
          for i in {1..30}; do
            if curl -s http://127.0.0 > /dev/null; then
              echo "✅ Ollama 服务已成功运行!"
              break
            fi
            echo "正在重试 ($i/30)..."
            sleep 1
          done

          echo "📥 正在通过 Ollama 拉取 HF 模型..."
          ollama pull hf.co/MaziyarPanahi/Llama-3.2-3B-Instruct-uncensored-GGUF:Q8_0

      # 📦 打包 Ollama 模型库(自动定位实际路径)
      - name: Package Models Directory
        run: |
          echo "📦 查找并打包 Ollama 模型库..."
          
          # 1. 自动寻找名为 'manifests' 或 'blobs' 的 models 目录
          OLLAMA_DIR=$(sudo find / -name "manifests" -type d 2>/dev/null | grep ".ollama/models" | head -n 1 | sed 's/\/models\/manifests//')
          
          if [ -z "$OLLAMA_DIR" ]; then
            # 备用搜索：直接定位 .ollama 目录
            OLLAMA_DIR=$(sudo find /usr /root /var $HOME -name ".ollama" -type d 2>/dev/null | head -n 1)
          fi

          echo "📍 找到 Ollama 模型实际存放目录: $OLLAMA_DIR"

          # 2. 执行打包
          if [ -n "$OLLAMA_DIR" ] && [ -d "$OLLAMA_DIR/models" ]; then
            sudo tar -czvf ollama_models1.tar.gz -C "$OLLAMA_DIR" models
            sudo chmod 666 ollama_models1.tar.gz
            echo "✅ 打包成功！"
          else
            echo "❌ 仍未找到 models 目录,列出可能位置以排查："
            sudo find / -name "blobs" 2>/dev/null
            exit 1
          fi

      # 4️⃣. 🛠️ 一键安装 Rclone(改用官方免秘钥直装脚本,避开 gpg 报错)
      - name: Install Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash


      # 🔑 注入网盘钥匙:把 GitHub Secrets 里的 Google Drive 凭证写进配置文件
      - name: Setup rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 5️⃣. ☁️ 上传到网盘
      - name: Upload Model to Cloud Drive
        run: |
          echo "🚀 开始上传到网盘..."
          rclone copy ./ollama_models1.tar.gz feadxus-Google-Drive:Models/ --progress

          echo "🏁 上传成功!"
