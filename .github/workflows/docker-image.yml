name: Download HF Model to Google Drive

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: '🤗 请输入 Hugging Face 仓库名称 (Org/Repo)'
        required: true
        default: 'mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit'

env:
  MODEL_REPO: ${{ inputs.repo_id }}

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:

      - name: 🛠️ 安装 Git LFS 与 Rclone
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs xz-utils
          git lfs install
          curl https://rclone.org/install.sh | sudo bash

      - name: ⚙️ 配置 Rclone (Google Drive)
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 📥 克隆 Hugging Face 完整仓库
        run: |
          # 格式化目录名称 (例如将 mlx-community/Qwen2.5 转换为 mlx-community_Qwen2.5)
          TARGET_DIR=$(echo $MODEL_REPO | tr '/' '_')
          
          # 直接克隆为完整的目标文件夹
          git clone https://huggingface.co/$MODEL_REPO "$TARGET_DIR"
          
          echo "仓库完整目录："
          ls -lh "$TARGET_DIR"

      - name: 🗜️ 打包整个仓库结构并高倍压缩
        run: |
          TARGET_DIR=$(echo $MODEL_REPO | tr '/' '_')
          
          # 将整个目录直接打包，保留顶级文件夹名和仓库内部完整结构
          tar -cf "${TARGET_DIR}.tar" "$TARGET_DIR"
          xz -T0 -9e "${TARGET_DIR}.tar"
          
          ls -lh "${TARGET_DIR}.tar.xz"

      - name: 📂 确保 Google Drive 目录存在
        run: |
          rclone mkdir feadxus-Google-Drive:/backup || true

      - name: 🚀 上传至 Google Drive
        run: |
          TARGET_DIR=$(echo $MODEL_REPO | tr '/' '_')
          rclone copy "${TARGET_DIR}.tar.xz" feadxus-Google-Drive:/backup/ --progress

      - name: ✅ 验证上传结果
        run: |
          rclone lsf feadxus-Google-Drive:/backup/
