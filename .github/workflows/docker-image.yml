name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # ====================================================================
      # 1️⃣. 腾出空间(保留清理逻辑,防止几十 GB 的模型文件挤爆 Runner)
      # ====================================================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理多余预装软件
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          df -h /

      # 2️⃣. 📥 安装 Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # 3️⃣. ⏬ 下载模型
      - name: Pull Ollama Model
        run: |
          sleep 5
          
          echo "📥 正在通过 Ollama 拉取 HF 模型..."
          ollama run hf.co/DreamFast/Qwen3-VL-4b-Heretic-GGUF:Q6_K

      # 📦 打包 Ollama 模型库
      - name: Package Models Directory
        run: |
          echo "📦 打包 Ollama 模型库..."
          # 打包整个 models 目录,后续解压回 ~/.ollama/models 即可免配置开箱即用
          sudo tar -czvf ollama_models.tar.gz -C $HOME/.ollama models

      # 4️⃣. 🛠️ 安装并配置 Rclone 上传工具
      - name: Install Rclone
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl https://rclone.org/rclone-anon.asc | sudo gpg --dearmor -o /etc/apt/keyrings/rclone.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rclone.gpg] https://rclone.org/deb deb main" | sudo tee /etc/apt/sources.list.d/rclone.list
          sudo apt-get update && sudo apt-get install rclone -y

      # 5️⃣. ☁️ 上传到网盘
      - name: Upload Model to Cloud Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

          echo "🚀 开始上传到网盘..."
          rclone copy ./ollama_models.tar.gz mydrive:Models/ --progress

          echo "🏁 上传成功!"
