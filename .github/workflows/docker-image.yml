name: Download Docker

on:
  workflow_dispatch:
    inputs:

      image:
        description: '📦 请输入 Docker 镜像名称 (包含 tag)'
        required: true
        default: 'dcflachs/veracrypt-gui'

      download_amd64:
        description: '⏬ 是否下载 AMD64 架构?'
        type: boolean
        default: true

      download_arm64:
        description: '⏬ 是否下载 ARM64 架构?'
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ inputs.image }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 删除工具,获取更多空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理工具链空间
        run: |
          sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/hostedtoolcache \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/share/swift \
          /usr/lib/jvm \
          /opt/az \
          /opt/microsoft

      - name: 查看空间
        run: df -h /

      - name: ☁️ 安装 Google Drive
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}

        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 🐳 Docker Hub 登录
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🖥️ 下载镜像与导出 AMD64 Image
        if: ${{ inputs.download_amd64 }}
        run: |
          docker pull \
          --platform linux/amd64 \
          $IMAGE_NAME

          docker save \
          $IMAGE_NAME \
          -o amd64.tar

      - name: 🖥️ 下载镜像与导出 ARM64 Image
        if: ${{ inputs.download_arm64 }}
        run: |
          docker pull \
          --platform linux/arm64 \
          $IMAGE_NAME

          docker save \
          $IMAGE_NAME \
          -o arm64.tar

      - name: 🏷️ 创建自己的 Docker Hub 镜像
        run: |
          IMAGE_TAG=$(basename $IMAGE_NAME)
          docker tag \
          $IMAGE_NAME \
          ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_TAG

      - name: 🚀 推送自己的 Docker Hub
        run: |
          IMAGE_TAG=$(basename $IMAGE_NAME)
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_TAG

      - name: 🗜️ 压缩镜像,准备上传镜像至网盘
        run: |
          tar -cf images.tar *.tar
          xz \
          -T0 \
          -9e \
          images.tar

      - name: 📂 Google Drive 创建备份目录
        run: |
          rclone mkdir \
          FEADXUS-Google-Drive:/backup \
          || true

      - name: 🚀 上传 Google Drive
        run: |
          rclone copy \
          images.tar.xz \
          FEADXUS-Google-Drive:/backup/

      - name: ✅ 验证
        run: |
          rclone lsf \
          FEADXUS-Google-Drive:/backup/
