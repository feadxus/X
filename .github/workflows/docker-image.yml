name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # ====================================================================
      # 1️⃣. 腾出空间(保留清理逻辑,防止几十 GB 的模型文件挤爆 Runner)
      # ====================================================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理多余预装软件
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          df -h /

      # 2️⃣. 📥 安装 Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # 3️⃣. ⏬ 下载模型
      - name: Pull Ollama Model
        run: |
          sleep 5
          
          echo "📥 正在通过 Ollama 拉取 HF 模型..."
          ollama run hf.co/DreamFast/Qwen3-VL-4b-Heretic-GGUF:Q6_K

      # 📦 打包 Ollama 模型库(自动定位实际路径)
      - name: Package Models Directory
        run: |
          echo "📦 查找并打包 Ollama 模型库..."
          
          # 1. 自动寻找名为 'manifests' 或 'blobs' 的 models 目录
          OLLAMA_DIR=$(sudo find / -name "manifests" -type d 2>/dev/null | grep ".ollama/models" | head -n 1 | sed 's/\/models\/manifests//')
          
          if [ -z "$OLLAMA_DIR" ]; then
            # 备用搜索：直接定位 .ollama 目录
            OLLAMA_DIR=$(sudo find /usr /root /var $HOME -name ".ollama" -type d 2>/dev/null | head -n 1)
          fi

          echo "📍 找到 Ollama 模型实际存放目录: $OLLAMA_DIR"

          # 2. 执行打包
          if [ -n "$OLLAMA_DIR" ] && [ -d "$OLLAMA_DIR/models" ]; then
            sudo tar -czvf ollama_models.tar.gz -C "$OLLAMA_DIR" models
            sudo chmod 666 ollama_models.tar.gz
            echo "✅ 打包成功！"
          else
            echo "❌ 仍未找到 models 目录，列出可能位置以排查："
            sudo find / -name "blobs" 2>/dev/null
            exit 1
          fi

      # 4️⃣. 🛠️ 安装并配置 Rclone 上传工具
      - name: Install Rclone
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl https://rclone.org/rclone-anon.asc | sudo gpg --dearmor -o /etc/apt/keyrings/rclone.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rclone.gpg] https://rclone.org/deb deb main" | sudo tee /etc/apt/sources.list.d/rclone.list
          sudo apt-get update && sudo apt-get install rclone -y

      # 5️⃣. ☁️ 上传到网盘
      - name: Upload Model to Cloud Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

          echo "🚀 开始上传到网盘..."
          rclone copy ./ollama_models.tar.gz mydrive:Models/ --progress

          echo "🏁 上传成功!"
