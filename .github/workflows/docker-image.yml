name: Download HF Model to Google Drive

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: '🤗 请输入 Hugging Face 仓库名称 (Org/Repo)'
        required: true
        default: 'mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit'

env:
  MODEL_REPO: ${{ inputs.repo_id }}

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 删除工具，获取更多磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理工具链空间
        run: |
          sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/hostedtoolcache \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/share/swift \
          /usr/lib/jvm \
          /opt/az \
          /opt/microsoft

      - name: 🔍 查看空间状态
        run: df -h /

      - name: 🛠️ 安装 Git LFS 与 Rclone
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs xz-utils
          git lfs install
          curl https://rclone.org/install.sh | sudo bash

      - name: ⚙️ 配置 Rclone (Google Drive)
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      - name: 📥 克隆 Hugging Face 模型仓库
        run: |
          # 提取仓库名称作为文件夹名 (例如 Qwen2.5-Coder-0.5B-Instruct-4bit)
          FOLDER_NAME=$(basename $MODEL_REPO)
          
          # 克隆模型仓库 (包含大文件 LFS 权重)
          git clone https://huggingface.co/$MODEL_REPO model_dir
          
          echo "模型目录结构："
          ls -lh model_dir

      - name: 🗜️ 高倍率打包压缩模型文件
        run: |
          # 提取仓库名用于压缩包命名
          REPO_NAME_CLEAN=$(echo $MODEL_REPO | tr '/' '_')
          
          tar -cf model.tar -C model_dir .
          xz -T0 -9e model.tar
          
          # 重命名为带模型名的压缩包
          mv model.tar.xz ${REPO_NAME_CLEAN}.tar.xz
          ls -lh ${REPO_NAME_CLEAN}.tar.xz

      - name: 📂 确保 Google Drive 目录存在
        run: |
          rclone mkdir feadxus-Google-Drive:/backup || true

      - name: 🚀 上传至 Google Drive
        run: |
          REPO_NAME_CLEAN=$(echo $MODEL_REPO | tr '/' '_')
          rclone copy ${REPO_NAME_CLEAN}.tar.xz feadxus-Google-Drive:/backup/ --progress

      - name: ✅ 验证上传结果
        run: |
          rclone lsf feadxus-Google-Drive:/backup/
