name: Download Model and Upload to Cloud Storage

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # ====================================================================
      # 1. 腾出空间（保留清理逻辑，防止几十 GB 的模型文件挤爆 Runner）
      # ====================================================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理多余预装软件
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          df -h /

      # 2. 📥 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. ⏬ 方式一：克隆整个仓库（或者用 huggingface-cli 单独下载需要的 .gguf 文件）
      - name: Clone Hugging Face Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "📥 开始克隆 Hugging Face 仓库..."
          git clone https://x-access-token:${HF_TOKEN}@huggingface.co/ponpoke/flux2-klein-9b-uncensored-text-encoder ./model_dir
          
          echo "📊 检查下载的文件列表及大小:"
          ls -lh ./model_dir

      # 4. 🛠️ 安装并配置 Rclone 上传工具
      - name: Install Rclone
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl https://rclone.org/rclone-anon.asc | sudo gpg --dearmor -o /etc/apt/keyrings/rclone.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rclone.gpg] https://rclone.org/deb deb main" | sudo tee /etc/apt/sources.list.d/rclone.list
          sudo apt-get update && sudo apt-get install rclone -y

      # 5. ☁️ 上传到网盘
      - name: Upload Model to Cloud Drive
        env:
          # 在 GitHub Secrets 中提前存好 rclone 的配置文件内容 (RCLONE_CONFIG)
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          
          echo "🚀 开始上传到网盘..."
          # 将 ./model_dir 目录上传到你在 rclone.conf 中配置的网盘 (假设配置名为 mydrive，目标文件夹名为 Models)
          rclone copy ./model_dir mydrive:Models/flux2-klein-9b --progress
          
          echo "🏁 上传成功!"
