name: Download Docker

on:
  workflow_dispatch:
    inputs:
      image:
        description: '📦 请输入 Docker 镜像名称 (包含 tag)'
        required: true
        default: 'olalie/tapmap:latest'
      download_amd64:
        description: '⏬ 是否下载 AMD64 架构?'
        type: boolean
        default: true
      download_arm64:
        description: '⏬ 是否下载 ARM64 架构?'
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ inputs.image }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # ====================================================================
      # 腾出空间!清理不需要的工具链
      # ====================================================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: 清理工具链空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/share/swift /usr/lib/jvm /opt/az /opt/microsoft

      - name: 查看清理后磁盘空间
        run: df -h /

      # 📡 安装 rclone
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      # 🔑 注入凭证
      - name: Setup rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 🆔 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. ⏬ 下载 AMD64 镜像 (仅当勾选时执行)
      - name: Pull and Save AMD64 Image
        if: ${{ inputs.download_amd64 }}
        run: |
          docker pull --platform linux/amd64 $IMAGE_NAME
          docker save $IMAGE_NAME -o amd64.tar

      # 2. ⏬ 下载 ARM64 镜像 (仅当勾选时执行)
      - name: Pull and Save ARM64 Image
        if: ${{ inputs.download_arm64 }}
        run: |
          docker pull --platform linux/arm64 $IMAGE_NAME
          docker save $IMAGE_NAME -o arm64.tar

      # 3. 🗜️ 极限压缩已下载的 tar 文件
      - name: Compress Downloaded Tarballs
        run: |
          # 动态匹配存在的 tar 文件进行打包压缩
          tar -c *.tar | xz -T0 -9e > images.tar.xz

      # 📂 创建网盘目录
      - name: Create Google Drive Folder
        run: |
          rclone mkdir feadxus-Google-Drive:/backup || true

      # 🚀 上传备份
      - name: Upload To Google Drive
        run: |
          rclone copy \
            images.tar.xz \
            feadxus-Google-Drive:/backup/

      # 🏁 确认状态
      - name: Verify Upload
        run: |
          rclone lsf feadxus-Google-Drive:/backup/
