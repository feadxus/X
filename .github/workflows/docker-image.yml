name: Download Docker

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 📡 搬运工上岗:安装强大的网盘传输工具 rclone
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
      # 🔑 注入网盘钥匙:把 GitHub Secrets 里的 Google Drive 凭证写进配置文件
      - name: Setup rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf
      # 登录镜像仓库(这里以 Docker Hub 为例,换成你自己的 Secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⏬ 下载镜像 
      - name: Pull Docker Image (amd64)
        run: |
          docker pull --platform linux/amd64 pytorch/pytorch:2.1.2-cuda12.1-cudnn8-devel

      # 🏷️ 给镜像换名字
      - name: Tag Docker Image
        run: |
          docker tag \
          pytorch/pytorch:2.1.2-cuda12.1-cudnn8-devel \
          ${{ secrets.DOCKERHUB_USERNAME }}/pytorch:2.1.2-cuda12.1-cudnn8-devel:latest

      # 🚀 上传自己的 Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/pytorch:2.1.2-cuda12.1-cudnn8-devel:latest

      # 🗜️ 一步到位流式压缩(省磁盘、省内存)
      - name: Save and Compress Docker Image
        run: |
          # 使用 -3 或 -4 压缩率，兼顾大小与内存，防止 GitHub 内存崩溃
          docker save pytorch:2.1.2-cuda12.1-cudnn8-devel | xz -T0 -3 > pytorch-:2.1.2-cuda12.1-cudnn8-devel.tar.xz

      # 📂 创建远程据点
      - name: Create Google Drive Folder
        run: |
          rclone mkdir fsxedx-Google-Drive:/backup || true

      # 🚀 冲向云端
      - name: Upload To Google Drive
        run: |
          rclone copy \
            openmmlab-mmagic-latest.tar.xz \
            fsxedx-Google-Drive:/backup/

      # 🏁 终审盘点
      - name: Verify Upload
        run: |
          rclone lsf fsxedx-Google-Drive:/backup/
