name: 🐳 Docker Container Test

# 触发条件：当你推送到 master/main 分支，或者提交 Pull Request 时触发
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  check-env:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（如果你的 Dockerfile 在仓库里需要现场构建，就保留这步；如果是直接测远端镜像，这步可以不要）
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Docker Hub 登录
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 拉取最新的镜像到 GitHub Actions 虚拟机本地
      - name: 📥 Pull Docker Image
        run: |
          docker pull feadxus/tabminal:latest

      # 4. 【核心测试步骤】非交互式运行容器，校验目录是否存在
      - name: 🔍 Check if .python-env exists in /root
        run: |
          docker run --rm --entrypoint="" feadxus/tabminal:latest sh -c '
            if [ -d "/root/.python-env" ]; then
              echo "=========================================="
              echo "✅ SUCCESS: /root/.python-env 目录存在！"
              echo "=========================================="
              exit 0
            else
              echo "=========================================="
              echo "❌ ERROR: 找不到 /root/.python-env 目录！"
              echo "=========================================="
              exit 1
            fi
          '
