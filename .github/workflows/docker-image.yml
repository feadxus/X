name: Download Docker

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 📡 搬运工上岗:安装强大的网盘传输工具 rclone
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
      # 🔑 注入网盘钥匙:把 GitHub Secrets 里的 Google Drive 凭证写进配置文件
      - name: Setup rclone config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf
      # 登录镜像仓库(这里以 Docker Hub 为例,换成你自己的 Secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⏬ 下载镜像 
      - name: Pull Docker Image (amd64)
        run: |
          docker pull --platform linux/amd64 killgfat/voice-changer

      # 🏷️ 给镜像换名字
      - name: Tag Docker Image
        run: |
          docker tag \
          killgfat/voice-changer \
          ${{ secrets.DOCKERHUB_USERNAME }}/voice-changer:latest

      # 🚀 上传自己的 Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/voice-changer:latest
