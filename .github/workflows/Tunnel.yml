name: Tunnel

on:
  workflow_dispatch:

jobs:
  start-tunnel:
    name: 🚇 Tunnel
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # 🐍 核心修复：初始化 Python 环境
    - name: 🛠️ Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🚀 Run Tunnel Script
      env:
        RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        GOOGLE_FEADXUS_GMAIL: ${{ secrets.GOOGLE_FEADXUS_GMAIL }}
        PYTHONUNBUFFERED: "1"
      run: |
        python Tunnel.py
